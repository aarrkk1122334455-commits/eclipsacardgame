<!doctype html><html lang="th"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#08060a;color:#f1e8ec;font-family:"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif}
body::before{content:'';position:fixed;inset:0;background:url(bg.webp) center/cover;opacity:.45;animation:z 30s ease-in-out infinite alternate;z-index:-2}
body::after{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at center,#08060a40,#08060ae8 85%);z-index:-1}
@keyframes z{to{transform:scale(1.08)}}
main{max-width:1060px;margin:0 auto;padding:28px 18px 40px;display:flex;flex-direction:column;align-items:center;gap:22px}
.logo{width:min(520px,86vw);filter:drop-shadow(0 0 24px #ff4a2a88);animation:in 1s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes in{from{transform:scale(.8);opacity:0}}
.tag{font-size:18px;color:#ffe2a8;text-align:center;margin:-8px 0 4px}
.hero{display:flex;gap:18px;justify-content:center;flex-wrap:wrap}
.hero img{height:min(34vh,300px);border-radius:12px;box-shadow:0 0 40px #f2b54b44,0 16px 40px #000;animation:f 3.4s ease-in-out infinite alternate}
.hero img:nth-child(2){animation-delay:-1.7s}@keyframes f{to{transform:translateY(-10px)}}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;width:100%}
.opt{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:22px 18px;border-radius:18px;text-decoration:none;color:#fff;border:2px solid;cursor:pointer;font:inherit;transition:transform .15s,box-shadow .15s}
.opt:hover{transform:translateY(-4px)}
.opt .ic{width:54px;height:54px;display:block}.opt .ic svg{width:100%;height:100%}.opt b{font-size:22px}.opt span{font-size:14px;opacity:.85;line-height:1.5}
.pc{background:linear-gradient(160deg,#2a1a40,#120a1e);border-color:#b07aff;box-shadow:0 0 24px #8a4aff44}
.mb{background:linear-gradient(160deg,#10304a,#0a1622);border-color:#5aa8ff;box-shadow:0 0 24px #3d8be044}
.wb{background:linear-gradient(160deg,#4a1414,#1e0808);border-color:#ff6a4a;box-shadow:0 0 24px #ff4a2a55}
.opt:hover.pc{box-shadow:0 0 40px #8a4aff99}.opt:hover.mb{box-shadow:0 0 40px #3d8be099}.opt:hover.wb{box-shadow:0 0 40px #ff4a2a99}
.ver{font-size:13px;color:#a8959f}
#how{display:none;max-width:640px;background:#140c12ee;border:1px solid #3d2b37;border-radius:14px;padding:14px 18px;line-height:1.8;font-size:15px}
#how.show{display:block;animation:in .25s}
#how h3{margin:0 0 4px;color:#f2b54b}
.yt{display:inline-flex;align-items:center;gap:8px;color:#fff;text-decoration:none;font-weight:bold;padding:6px 14px;border-radius:20px;background:#140b10e6;border:1px solid #ff003366}
footer{color:#7a6a72;font-size:12.5px;text-align:center}
</style></head><body><main>
<img class="logo" src="logo.webp" alt="ECLIPSA">
<div class="tag">เกมการ์ดออนไลน์ · ควิกเพลย์ 1v1 / 2v2 · เล่นข้ามกันได้ทั้งคอมและมือถือ</div>
<div class="hero"><img src="hero.webp" alt=""><img src="hero2.webp" alt=""></div>
<div class="opts">
  <a class="opt pc" href="https://github.com/aarrkk1122334455-commits/eclipsacardgame/releases/latest/download/Eclipsa.exe"><div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#e6d4ff" stroke-width="3" stroke-linejoin="round"><rect x="5" y="8" width="38" height="25" rx="3"/><path d="M18 40h12M24 33v7"/><path d="M24 14v12m-5-5 5 5 5-5" stroke="#ffd76a"/></svg></div><b>โหลดลงคอม</b><span>Windows · ไฟล์ Eclipsa.exe<br>อัปเดตให้อัตโนมัติทุกครั้งที่เปิดเกม</span></a>
  <button class="opt mb" id="inst"><div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#cfe6ff" stroke-width="3" stroke-linejoin="round"><rect x="13" y="4" width="22" height="40" rx="4"/><path d="M21 39h6"/><path d="M24 11v14m-5-5 5 5 5-5" stroke="#ffd76a"/></svg></div><b>โหลดลงมือถือ / iPad</b><span>Android · iPhone · iPad · แท็บเล็ต<br>ติดตั้งเป็นแอปบนหน้าจอหลัก เปิดเต็มจอ</span></button>
  <a class="opt wb" href="play/"><div class="ic"><svg viewBox="0 0 48 48" fill="none" stroke="#ffd2c8" stroke-width="3"><circle cx="24" cy="24" r="19"/><path d="M5 24h38M24 5c6 6 6 32 0 38M24 5c-6 6-6 32 0 38"/><path d="M20 17l11 7-11 7z" fill="#ffd76a" stroke="none"/></svg></div><b>เล่นผ่านเว็บ</b><span>เปิดเล่นได้ทันที ไม่ต้องติดตั้ง<br>ใช้ได้ทุกเครื่องที่มีเบราว์เซอร์</span></a>
</div>
<div id="how"></div>
<div class="ver">เวอร์ชันล่าสุด: 34</div>
<a class="yt" href="https://www.youtube.com/@brownsugarpow" target="_blank" rel="noopener"><svg viewBox="0 0 28 20" width="30" height="22"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 5.5v9l8-4.5z" fill="#fff"/></svg>@BrownSugar</a>
<footer>Eclipsa Card Game</footer>
</main>
<script>
let ev=null;addEventListener('beforeinstallprompt',e=>{e.preventDefault();ev=e});
const ipad=/iPad/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ios=ipad||/iPhone|iPod/i.test(navigator.userAgent),android=/Android/i.test(navigator.userAgent),how=document.getElementById('how');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
document.getElementById('inst').onclick=async()=>{
  // Android Chrome: the real "install app" dialog
  if(ev){ev.prompt();const r=await ev.userChoice.catch(()=>null);ev=null;if(r&&r.outcome==='accepted'){how.innerHTML='<h3>✔ ติดตั้งแล้ว</h3>ไอคอน Eclipsa อยู่บนหน้าจอหลักของมือถือแล้ว';how.classList.add('show')}return}
  if(!ios&&!android){how.innerHTML='<h3>📱 ติดตั้งบนมือถือ</h3>เปิดหน้านี้ในมือถือ แล้วกดปุ่ม "โหลดลงมือถือ" อีกครั้ง<br>หรือเปิดลิงก์ <b>'+location.href.replace(/[^/]*$/,'')+'play/</b> ในมือถือ';how.classList.add('show');return}
  if(ios){how.innerHTML='<h3>ติดตั้งบน '+(ipad?'iPad':'iPhone')+'</h3>1. กดปุ่ม <b>"เล่นผ่านเว็บ"</b> (ต้องเปิดใน Safari)<br>2. กดปุ่มแชร์ <b>⬆</b> '+(ipad?'มุมขวาบน':'ด้านล่าง')+'<br>3. เลือก <b>"เพิ่มไปยังหน้าจอโฮม"</b> → จะได้ไอคอน Eclipsa บนหน้าจอ';how.classList.add('show');return}
  how.innerHTML='<h3>📱 ติดตั้งบน Android</h3>1. กดปุ่ม <b>"เล่นผ่านเว็บ"</b> (ใช้ Chrome)<br>2. กดเมนู <b>⋮</b> มุมขวาบน<br>3. เลือก <b>"ติดตั้งแอป"</b> หรือ <b>"เพิ่มลงในหน้าจอหลัก"</b> → จะได้ไอคอน Eclipsa บนหน้าจอ';how.classList.add('show');
};
</script></body></html>
